<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>super secret wow!!!</title>
	<style>
		html, body { background: #000; }
		#video { display: none; width: auto; height: auto; }
		#startScreen {color:white; font-size:large; text-align:center; margin-top: 20%;}
	</style>
</head>
<body>
<div id="startScreen">
    Hello! Click to start
</div>
<video id="video">
    <source src="supersecret.mp4" type="video/mp4">
</video>
<a href="secret.html" style="color: black;">actually the secret</a>
<script>
	const startScreen = document.getElementById('startScreen');
	const video = document.getElementById('video');

	startScreen.addEventListener('click', () => {
		startScreen.style.display = 'none';
		video.style.display = 'block';
		video.play();
	});
</script>
</body>
</html>
